<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="./static/mywebscript.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 36px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #38bdf8;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        textarea {
            width: 100%;
            height: 110px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            padding: 12px;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            margin-top: 16px;
            background: #0284c7;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: #0369a1;
        }
        button:active {
            transform: scale(0.99);
        }
        #system_response {
            margin-top: 24px;
            padding: 16px;
            background: #0f172a;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            font-size: 0.95rem;
            line-height: 1.5;
            min-height: 24px;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emotion Detector</h1>
        <p class="subtitle">Enter text below to detect emotions using Watson NLP</p>
        <textarea id="textToAnalyze" placeholder="Type a sentence here (e.g., I am so excited about this!)..."></textarea>
        <button onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
        <div id="system_response">System response will appear here...</div>
    </div>
</body>
</html>
